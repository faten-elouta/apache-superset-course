<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" aria-label="Schéma du verre à martini"><title>Schéma du verre à martini</title><rect width="320" height="480" rx="14" fill="#f6f5fb"/><text x="160" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1c1830" text-anchor="middle" font-weight="800">Verre à martini</text><text x="160" y="52" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b6684" text-anchor="middle">Segel et Heer — structure hybride</text><g class="zone" data-step="2"><path d="M40,80 L280,80 L172,230 L148,230 Z" fill="#eee8fc" stroke="#6b3fd1" stroke-width="2"/><text x="160" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b3fd1" text-anchor="middle" font-weight="800">Le bol</text><text x="160" y="130" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="middle">guidé par le lecteur :</text><text x="160" y="145" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="middle">exploration libre, filtres</text><line x1="160" y1="225" x2="69" y2="105" stroke="#6b3fd1" stroke-width="1.5"/><path d="M69,105 L77.0,109.1 L70.8,113.8 Z" fill="#6b3fd1"/><line x1="160" y1="225" x2="121" y2="120" stroke="#6b3fd1" stroke-width="1.5"/><path d="M121,120 L127.5,126.2 L120.2,129.0 Z" fill="#6b3fd1"/><line x1="160" y1="225" x2="199" y2="120" stroke="#6b3fd1" stroke-width="1.5"/><path d="M199,120 L199.8,129.0 L192.5,126.2 Z" fill="#6b3fd1"/><line x1="160" y1="225" x2="251" y2="105" stroke="#6b3fd1" stroke-width="1.5"/><path d="M251,105 L249.2,113.8 L243.0,109.1 Z" fill="#6b3fd1"/></g><g class="zone" data-step="1"><rect x="150" y="230" width="20" height="150" fill="#c02d6b"/><path d="M100,380 L220,380 L220,394 L100,394 Z" fill="#c02d6b"/><text x="184" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#c02d6b" text-anchor="start" font-weight="800">La tige</text><text x="184" y="308" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="start">guidée par l’auteur :</text><text x="184" y="323" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="start">une séquence</text><text x="184" y="338" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="start">de messages</text><line x1="130" y1="375" x2="130" y2="245" stroke="#c02d6b" stroke-width="2"/><path d="M130,245 L133.9,253.1 L126.1,253.1 Z" fill="#c02d6b"/></g><text x="24" y="424" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">On lit d’abord la tige (de bas en haut), puis le</text><text x="24" y="438.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">récit s’ouvre à l’exploration.</text></svg>
