<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Maquette de dashboard question, preuves, retour"><title>Maquette de dashboard question, preuves, retour</title><rect width="760" height="480" rx="14" fill="#f6f5fb"/><rect x="16" y="14" width="728" height="44" rx="10" fill="#1d1736"/><text x="30" y="33" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="800">Le printemps 2026 a-t-il été anormalement chaud à Tours ?</text><text x="30" y="49" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#c9c2ea" text-anchor="start">Dashboard PREVIZO — question → preuves → retour à la question</text><g class="zone" data-step="1" data-label="La question ou l’affirmation de départ"><rect x="16" y="68" width="728" height="44" rx="8" fill="#eee8fc" stroke="#eee8fc" stroke-width="1"/><text x="380" y="95" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b3fd1" text-anchor="middle" font-weight="700">❓ La question posée au lecteur : Tours a-t-elle connu un printemps anormal ?</text><circle cx="30" cy="90" r="11" fill="#6b3fd1"/><text x="30" y="94" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">1</text></g><g class="zone" data-step="2" data-label="Les preuves, une par une"><rect x="16" y="122" width="236" height="200" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="26" y="138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Preuve 1 — hausse d’avril à mai</text><text x="26" y="308" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#c02d6b" text-anchor="start" font-weight="800">+6,6 °C</text><polyline points="182.0,307.9 196.0,304.9 210.0,299.7 224.0,295.7 238.0,286.4" fill="none" stroke="#c02d6b" stroke-width="2"/><rect x="262" y="122" width="236" height="200" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="272" y="139" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="700">Preuve 2 — elle décroche en mai</text><line x1="276" x2="486" y1="269.77777777777777" y2="269.77777777777777" stroke="#e3e0ee"/><line x1="276" x2="486" y1="227" y2="227" stroke="#e3e0ee"/><line x1="276" x2="486" y1="184.22222222222223" y2="184.22222222222223" stroke="#e3e0ee"/><text x="276" y="316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">janv.</text><text x="328.5" y="316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">févr.</text><text x="381" y="316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">mars</text><text x="433.5" y="316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">avr.</text><text x="486" y="316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">mai</text><polyline points="276.0,288.6 328.5,273.2 381.0,243.3 433.5,217.6 486.0,182.5" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="276.0,293.7 328.5,277.5 381.0,245.8 433.5,221.0 486.0,187.6" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="276.0,283.5 328.5,269.8 381.0,239.8 433.5,215.0 486.0,179.9" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="276.0,296.3 328.5,280.9 381.0,251.0 433.5,226.1 486.0,193.6" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="276.0,286.0 328.5,268.1 381.0,236.4 433.5,211.6 486.0,155.1" fill="none" stroke="#c02d6b" stroke-width="2.6"/><circle cx="486" cy="155.13333333333335" r="3.5" fill="#c02d6b"/><text x="480" y="149.13333333333335" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#c02d6b" text-anchor="end" font-weight="700">+6,6 °C</text><rect x="508" y="122" width="236" height="200" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="518" y="139" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="700">Preuve 3 — la plus chaude</text><text x="564" y="163" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end" font-weight="700">Tours</text><rect x="570" y="152" width="134.8" height="14" rx="2" fill="#c02d6b"/><text x="708.784" y="163" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#c02d6b" text-anchor="start" font-weight="700">23,4</text><text x="564" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Bourges</text><rect x="570" y="171" width="118.1" height="14" rx="2" fill="#c3bfd2"/><text x="692.08" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">20,5</text><text x="564" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Blois</text><rect x="570" y="190" width="116.4" height="14" rx="2" fill="#c3bfd2"/><text x="690.352" y="201" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">20,2</text><text x="564" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Orléans</text><rect x="570" y="209" width="112.9" height="14" rx="2" fill="#c3bfd2"/><text x="686.896" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">19,6</text><text x="564" y="239" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Chartres</text><rect x="570" y="228" width="108.9" height="14" rx="2" fill="#c3bfd2"/><text x="682.864" y="239" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">18,9</text><circle cx="236" cy="138" r="11" fill="#1c1830"/><text x="236" y="142" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">2</text></g><g class="zone" data-step="3" data-label="Le retour à la question : la réponse"><rect x="16" y="332" width="728" height="134" rx="8" fill="#fbe5ee" stroke="#c02d6b" stroke-width="1"/><text x="32" y="356" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#c02d6b" text-anchor="start" font-weight="800">✔ Réponse : oui.</text><text x="32" y="376" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#1c1830" text-anchor="start">En mai, Tours gagne 6,6 °C quand les autres stations gagnent environ 4 °C : c’est la plus forte hausse et la station la</text><text x="32" y="391" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#1c1830" text-anchor="start">plus chaude du réseau. Son suivi doit être renforcé.</text><circle cx="730" cy="346" r="11" fill="#c02d6b"/><text x="730" y="350" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">3</text></g><path d="M748,400 C772,400 772,90 748,90" fill="none" stroke="#c02d6b" stroke-width="2" stroke-dasharray="5 4"/></svg>
