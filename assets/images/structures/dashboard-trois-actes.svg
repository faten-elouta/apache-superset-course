<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Maquette de dashboard en trois actes"><title>Maquette de dashboard en trois actes</title><rect width="760" height="480" rx="14" fill="#f6f5fb"/><rect x="16" y="14" width="728" height="44" rx="10" fill="#1d1736"/><text x="30" y="33" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="800">Le printemps 2026 sur le réseau PREVIZO</text><text x="30" y="49" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#c9c2ea" text-anchor="start">Dashboard PREVIZO — structure en trois actes (un onglet par acte)</text><g><rect x="16" y="66" width="728" height="28" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><rect x="22" y="70" width="152" height="20" rx="6" fill="#1d1736" stroke="#1d1736" stroke-width="1"/><text x="98" y="84" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">Acte 1 · Contexte</text><rect x="182" y="70" width="152" height="20" rx="6" fill="#f6f5fb" stroke="#e3e0ee" stroke-width="1"/><text x="258" y="84" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="middle" font-weight="700">Acte 2 · Analyse</text><rect x="342" y="70" width="152" height="20" rx="6" fill="#f6f5fb" stroke="#e3e0ee" stroke-width="1"/><text x="418" y="84" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="middle" font-weight="700">Acte 3 · Recommandations</text></g><g class="zone" data-step="1" data-label="Acte 1 : poser le contexte"><rect x="16" y="104" width="236" height="362" rx="8" fill="#fbfaff" stroke="#e3e0ee" stroke-width="1"/><text x="28" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#6b6684" text-anchor="start" font-weight="800">ONGLET 1 — CONTEXTE</text><rect x="26" y="134" width="216" height="108" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="36" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="800">Pourquoi suivre la chaleur ?</text><text x="36" y="168" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Cinq stations mesurent les températures</text><text x="36" y="181.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">du réseau. Un printemps chaud annonce</text><text x="36" y="195" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">des risques pour l’été : sécheresse,</text><text x="36" y="208.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">vigilance canicule.</text><rect x="26" y="252" width="216" height="64" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="36" y="268" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Réseau PREVIZO</text><text x="36" y="302" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#1c1830" text-anchor="start" font-weight="800">5 stations</text><rect x="26" y="326" width="216" height="128" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="36" y="344" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="800">Définitions</text><text x="36" y="360" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Tmax : température maximale</text><text x="36" y="373.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">journalière. Moyenne mensuelle par</text><text x="36" y="387" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">station, janvier à mai 2026.</text><circle cx="236" cy="116" r="11" fill="#c02d6b"/><text x="236" y="120" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">1</text></g><g class="zone" data-step="2" data-label="Acte 2 : dérouler l’analyse"><rect x="262" y="104" width="236" height="362" rx="8" fill="#fbfaff" stroke="#e3e0ee" stroke-width="1"/><text x="274" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#6b6684" text-anchor="start" font-weight="800">ONGLET 2 — ANALYSE</text><rect x="272" y="134" width="216" height="160" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="282" y="151" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="700">Évolution des maximales</text><line x1="286" x2="476" y1="250.66666666666666" y2="250.66666666666666" stroke="#e3e0ee"/><line x1="286" x2="476" y1="219" y2="219" stroke="#e3e0ee"/><line x1="286" x2="476" y1="187.33333333333331" y2="187.33333333333331" stroke="#e3e0ee"/><text x="286" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">janv.</text><text x="333.5" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">févr.</text><text x="381" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">mars</text><text x="428.5" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">avr.</text><text x="476" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8" fill="#a29dba" text-anchor="middle">mai</text><polyline points="286.0,264.6 333.5,253.2 381.0,231.0 428.5,212.0 476.0,186.1" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="286.0,268.4 333.5,256.4 381.0,232.9 428.5,214.6 476.0,189.9" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="286.0,260.8 333.5,250.7 381.0,228.5 428.5,210.1 476.0,184.2" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="286.0,270.3 333.5,258.9 381.0,236.7 428.5,218.4 476.0,194.3" fill="none" stroke="#c3bfd2" stroke-width="1.4"/><polyline points="286.0,262.7 333.5,249.4 381.0,226.0 428.5,207.6 476.0,165.8" fill="none" stroke="#c02d6b" stroke-width="2.6"/><circle cx="476" cy="165.8" r="3.5" fill="#c02d6b"/><text x="470" y="159.8" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#c02d6b" text-anchor="end" font-weight="700">+6,6 °C</text><rect x="272" y="302" width="216" height="152" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="282" y="319" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="700">Classement en mai</text><text x="328" y="343" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end" font-weight="700">Tours</text><rect x="334" y="332" width="116.1" height="14" rx="2" fill="#c02d6b"/><text x="454.06399999999996" y="343" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#c02d6b" text-anchor="start" font-weight="700">23,4</text><text x="328" y="362" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Bourges</text><rect x="334" y="351" width="101.7" height="14" rx="2" fill="#c3bfd2"/><text x="439.68" y="362" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">20,5</text><text x="328" y="381" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Blois</text><rect x="334" y="370" width="100.2" height="14" rx="2" fill="#c3bfd2"/><text x="438.192" y="381" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">20,2</text><text x="328" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Orléans</text><rect x="334" y="389" width="97.2" height="14" rx="2" fill="#c3bfd2"/><text x="435.216" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">19,6</text><text x="328" y="419" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Chartres</text><rect x="334" y="408" width="93.7" height="14" rx="2" fill="#c3bfd2"/><text x="431.74399999999997" y="419" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">18,9</text><circle cx="482" cy="116" r="11" fill="#6b3fd1"/><text x="482" y="120" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">2</text></g><g class="zone" data-step="3" data-label="Acte 3 : conclure et recommander"><rect x="508" y="104" width="236" height="362" rx="8" fill="#fbfaff" stroke="#e3e0ee" stroke-width="1"/><text x="520" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#6b6684" text-anchor="start" font-weight="800">ONGLET 3 — RECOMMANDATIONS</text><rect x="518" y="134" width="216" height="120" rx="8" fill="#fbe5ee" stroke="#fbe5ee" stroke-width="1"/><text x="528" y="152" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#c02d6b" text-anchor="start" font-weight="800">Ce qu’il faut retenir</text><text x="528" y="168" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Tours connaît la plus forte hausse du</text><text x="528" y="181.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">réseau en mai (+6,6 °C), nettement</text><text x="528" y="195" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">au-dessus des autres stations.</text><rect x="518" y="264" width="216" height="190" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="528" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="800">Actions proposées</text><text x="528" y="298" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">1. Renforcer le suivi de Tours dès</text><text x="528" y="311.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">juin.  2. Vérifier le capteur.  3.</text><text x="528" y="325" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Préparer une alerte canicule.</text><circle cx="728" cy="116" r="11" fill="#1d5fc4"/><text x="728" y="120" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">3</text></g></svg>
