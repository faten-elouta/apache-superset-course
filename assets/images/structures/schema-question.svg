<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" aria-label="Schéma question, preuves, retour"><title>Schéma question, preuves, retour</title><rect width="320" height="480" rx="14" fill="#f6f5fb"/><text x="160" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1c1830" text-anchor="middle" font-weight="800">Question → preuves → retour</text><text x="160" y="52" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b6684" text-anchor="middle">Kosara — inspiré du récit classique</text><g class="zone" data-step="1"><rect x="60" y="76" width="200" height="56" rx="28" fill="#eee8fc" stroke="#6b3fd1" stroke-width="1"/><text x="160" y="100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b3fd1" text-anchor="middle" font-weight="800">Question</text><text x="160" y="118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b6684" text-anchor="middle">ou affirmation</text></g><line x1="160" y1="134" x2="160" y2="160" stroke="#a29dba" stroke-width="2"/><path d="M160,160 L156.1,151.9 L163.9,151.9 Z" fill="#a29dba"/><g class="zone" data-step="2"><rect x="40" y="164" width="72" height="80" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="76" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="middle" font-weight="700">Preuve 1</text><rect x="54" y="222" width="10" height="14" fill="#c3bfd2"/><rect x="68" y="216" width="10" height="20" fill="#c3bfd2"/><rect x="82" y="220" width="10" height="16" fill="#c3bfd2"/><rect x="124" y="164" width="72" height="80" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="160" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="middle" font-weight="700">Preuve 2</text><rect x="138" y="218" width="10" height="18" fill="#c3bfd2"/><rect x="152" y="213" width="10" height="23" fill="#c3bfd2"/><rect x="166" y="220" width="10" height="16" fill="#c3bfd2"/><rect x="208" y="164" width="72" height="80" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="244" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="middle" font-weight="700">Preuve 3</text><rect x="222" y="214" width="10" height="22" fill="#c3bfd2"/><rect x="236" y="210" width="10" height="26" fill="#c02d6b"/><rect x="250" y="220" width="10" height="16" fill="#c3bfd2"/></g><line x1="160" y1="248" x2="160" y2="274" stroke="#a29dba" stroke-width="2"/><path d="M160,274 L156.1,265.9 L163.9,265.9 Z" fill="#a29dba"/><g class="zone" data-step="3"><rect x="60" y="278" width="200" height="56" rx="28" fill="#fbe5ee" stroke="#c02d6b" stroke-width="1"/><text x="160" y="302" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#c02d6b" text-anchor="middle" font-weight="800">Réponse</text><text x="160" y="320" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="middle">les preuves relient la fin au début</text></g><path d="M262,306 C310,306 310,104 262,104" fill="none" stroke="#c02d6b" stroke-width="2" stroke-dasharray="5 4"/><line x1="272" y1="104" x2="263" y2="104" stroke="#c02d6b" stroke-width="2"/><path d="M263,104 L271.1,100.1 L271.1,107.9 Z" fill="#c02d6b"/><text x="24" y="380" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">On ne révèle pas tout d’emblée : on pose la</text><text x="24" y="394.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">question, on apporte les preuves, puis on y répond.</text></svg>
