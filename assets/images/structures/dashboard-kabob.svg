<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Maquette de dashboard en kabob"><title>Maquette de dashboard en kabob</title><rect width="760" height="480" rx="14" fill="#f6f5fb"/><rect x="16" y="14" width="728" height="44" rx="10" fill="#1d1736"/><text x="30" y="33" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="800">Tours doit être équipée en priorité</text><text x="30" y="49" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#c9c2ea" text-anchor="start">Dashboard PREVIZO — kabob (un ancrage rappelé du début à la fin)</text><line x1="40" y1="80" x2="40" y2="456" stroke="#1c1830" stroke-width="4" stroke-linecap="round"/><g class="zone" data-step="1" data-label="L’ancrage"><circle cx="40" cy="104" r="14" fill="#c02d6b"/><rect x="66" y="70" width="678" height="70" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="76" y="86" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Ancrage — le fait marquant qui ouvre le récit</text><text x="76" y="126" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#c02d6b" text-anchor="start" font-weight="800">Tours : +6,6 °C en un mois</text><circle cx="40" cy="104" r="11" fill="#c02d6b"/><text x="40" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">1</text></g><g class="zone" data-step="2" data-label="Le corps : les preuves"><rect x="28" y="162" width="24" height="24" rx="4" fill="#c3bfd2" stroke="#c3bfd2" stroke-width="1"/><rect x="28" y="250" width="24" height="24" rx="4" fill="#c3bfd2" stroke="#c3bfd2" stroke-width="1"/><rect x="28" y="330" width="24" height="24" rx="4" fill="#c3bfd2" stroke="#c3bfd2" stroke-width="1"/><rect x="66" y="150" width="330" height="170" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="76" y="167" font-fa