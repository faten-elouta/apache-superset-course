 stroke="#e3e0ee" stroke-width="1"/><text x="416" y="167" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="700">Corps 2 — la station la plus chaude</text><text x="462" y="191" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end" font-weight="700">Tours</text><rect x="468" y="180" width="230.3" height="14" rx="2" fill="#c02d6b"/><text x="702.256" y="191" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#c02d6b" text-anchor="start" font-weight="700">23,4</text><text x="462" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Bourges</text><rect x="468" y="199" width="201.7" height="14" rx="2" fill="#c3bfd2"/><text x="673.72" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">20,5</text><text x="462" y="229" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Blois</text><rect x="468" y="218" width="198.8" height="14" rx="2" fill="#c3bfd2"/><text x="670.768" y="229" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">20,2</text><text x="462" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Orléans</text><rect x="468" y="237" width="192.9" height="14" rx="2" fill="#c3bfd2"/><text x="664.864" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">19,6</text><text x="462" y="267" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#1c1830" text-anchor="end">Chartres</text><rect x="468" y="256" width="186.0" height="14" rx="2" fill="#c3bfd2"/><text x="657.976" y="267" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#6b6684" text-anchor="start">18,9</text><rect x="66" y="328" width="678" height="52" rx="8" fill="#ffffff" stroke="#e3e0ee" stroke-width="1"/><text x="76" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start" font-weight="800">Corps 3 — un écart net</text><text x="76" y="362" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" fill="#6b6684" text-anchor="start">Les quatre autres stations gagnent environ 4 °C entre avril et mai : Tours se détache nettement du reste du réseau.</text><circle cx="40" cy="174" r="11" fill="#1c1830"/><text x="40" y="178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">2</text></g><g class="zone" data-step="3" data-label="Le rappel de l’ancrage et l’action"><circle cx="40" cy="420" r="14" fill="#c02d6b"/><rect x="66" y="390" width="678" height="66" rx="8" fill="#fbe5ee" stroke="#c02d6b" stroke-width="1"/><text x="80" y="412" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#c02d6b" text-anchor="start" font-weight="800">Retour à l’ancrage : +6,6 °C à Tours</text><text x="80" y="432" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#1c1830" text-anchor="start">Recommandation : équiper Tours d’un second capteur et renforcer son suivi dès juin.</text><circle cx="40" cy="420" r="11" fill="#c02d6b"/><text x="40" y="424" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="800">3</text></g></svg>
