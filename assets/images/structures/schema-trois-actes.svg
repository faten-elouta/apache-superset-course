<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" aria-label="Schéma de la structure en trois actes"><title>Schéma de la structure en trois actes</title><rect width="320" height="480" rx="14" fill="#f6f5fb"/><text x="160" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1c1830" text-anchor="middle" font-weight="800">Trois actes</text><text x="160" y="52" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b6684" text-anchor="middle">Pyramide de Freytag</text><path d="M24,330 L110,330 Q190,330 210,150 Q226,210 296,300" fill="none" stroke="#1c1830" stroke-width="3"/><circle cx="210" cy="150" r="7" fill="#c02d6b"/><text x="210" y="132" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#c02d6b" text-anchor="middle" font-weight="700">message principal</text><g class="zone" data-step="1"><rect x="18" y="350" width="92" height="70" rx="8" fill="#fbe5ee" stroke="#c02d6b" stroke-width="1"/><text x="64" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#c02d6b" text-anchor="middle" font-weight="800">Acte 1</text><text x="64" y="390" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="middle">Exposition</text><text x="64" y="405" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#6b6684" text-anchor="middle">contexte</text></g><g class="zone" data-step="2"><rect x="114" y="350" width="92" height="70" rx="8" fill="#eee8fc" stroke="#6b3fd1" stroke-width="1"/><text x="160" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b3fd1" text-anchor="middle" font-weight="800">Acte 2</text><text x="160" y="390" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="middle">Montée</text><text x="160" y="405" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#6b6684" text-anchor="middle">analyse</text></g><g class="zone" data-step="3"><rect x="210" y="350" width="92" height="70" rx="8" fill="#e3edfc" stroke="#1d5fc4" stroke-width="1"/><text x="256" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#1d5fc4" text-anchor="middle" font-weight="800">Acte 3</text><text x="256" y="390" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#1c1830" text-anchor="middle">Résolution</text><text x="256" y="405" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" fill="#6b6684" text-anchor="middle">recommandations</text></g><text x="24" y="446" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">Une démonstration qui progresse vers le message,</text><text x="24" y="460.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">puis conclut.</text></svg>
