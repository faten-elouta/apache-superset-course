<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" role="img" aria-label="Schéma de la pyramide inversée"><title>Schéma de la pyramide inversée</title><rect width="320" height="480" rx="14" fill="#f6f5fb"/><text x="160" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1c1830" text-anchor="middle" font-weight="800">Pyramide inversée</text><text x="160" y="52" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b6684" text-anchor="middle">Kosara — le journalisme</text><g class="zone" data-step="1"><path d="M30,80 L290,80 L247,190 L73,190 Z" fill="#c02d6b"/><text x="160" y="130" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="800">L’essentiel</text><text x="160" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">message + chiffres clés</text></g><g class="zone" data-step="2"><path d="M77,198 L243,198 L204,300 L116,300 Z" fill="#6b3fd1"/><text x="160" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="800">Les preuves</text><text x="160" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">graphiques</text></g><g class="zone" data-step="3"><path d="M120,308 L200,308 L160,410 Z" fill="#1d5fc4"/><text x="160" y="344" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="800">Détails</text></g><text x="24" y="438" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">Importance décroissante : le lecteur pressé</text><text x="24" y="452.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b6684" text-anchor="start">s’arrête en haut.</text></svg>
